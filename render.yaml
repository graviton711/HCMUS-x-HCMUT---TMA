# Backend preview blueprint (Render). Stateless once runtime data lives in
# Postgres (migrations/004_runtime_store.sql on the shared Supabase DB), so the
# free plan works — it sleeps when idle and cold-starts after that.
services:
  - type: web
    name: mlai-tour-backend
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run tour-backend serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_TOUR_DB_URL
        sync: false
      - key: NVIDIA_NIM_API
        sync: false
      - key: CORS_ORIGINS
        sync: false
