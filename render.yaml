# Backend preview blueprint (Render). Team deploys via Render dashboard or CLI.
# SQLite needs a persistent disk; Render free instances have none, so use a
# paid instance with the disk below for a shared team preview.
services:
  - type: web
    name: mlai-tour-backend
    runtime: python
    plan: starter
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run tour-backend serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: backend-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/data/backend.db
      - key: DATA_PROVIDER
        value: supabase
      - key: SUPABASE_TOUR_DB_URL
        sync: false
      - key: NVIDIA_NIM_API
        sync: false
      - key: CORS_ORIGINS
        sync: false
