# Split free boxes (512 MB each): backend and agent server separated after the
# single-box OOM. Same image (`Dockerfile` + `start.sh`), ROLE picks process.
# Deploy order: opencode first (copy its public URL), then set the backend's
# OPENCODE_SERVER_URL to it. No password on serve for demo week (health checks
# need a public endpoint; URL is unguessable); add OPENCODE_SERVER_PASSWORD on
# both boxes + runner --password only if abuse appears.
services:
  - type: web
    name: mlai-tour-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ROLE
        value: backend
      - key: SUPABASE_TOUR_DB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENCODE_SERVER_URL
        sync: false
      - key: OPENCODE_MODEL
        value: opencode/muse-spark-1.3-contributor-free
      - key: OPENCODE_AGENT
        value: travel-consultant
      - key: OPENCODE_PROJECT_DIR
        value: /app
  - type: web
    name: mlai-opencode
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /global/health
    envVars:
      - key: ROLE
        value: opencode
      - key: SUPABASE_TOUR_DB_URL
        sync: false
