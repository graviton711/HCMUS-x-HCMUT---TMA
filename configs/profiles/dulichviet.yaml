# yaml-language-server: $schema=../profile.schema.json
origin: dulichviet.com.vn
render: false
flows:
- static
sitemaps:
- https://dulichviet.com.vn/sitemap.xml
- https://dulichviet.com.vn/sitemap_tour_index.xml
tour_url_patterns:
- /du-lich-
- /loai-hinh-du-lich/
discovery:
  method: search_pages
  entry: https://dulichviet.com.vn/tim-kiem?q=&type=tour
  page_param: page
  per_page_param: perPage
  per_page: 50
  max_pages: 200
  strip_query: true
  keep_query: [startday]
fields:
  tour_name:
    source: css
    selector: h1.ct2-page-title
  departure_city:
    source: css
    selector: div.ct2-hero-meta > div.ct2-hero-meta-item:nth-of-type(2) b
  destinations:
    source: css
    selector: table[border="0"]
    clean: '[re.sub(r''(?i)^\s*(khám phá|tham quan|du lịch(\s+khách\s+đoàn)?(\s+tour)?)\s+'',
      '''', s).strip() for s in re.split(r''\s*-\s*'', (research(r''Hành trình\s*(.*?)\s*(?:Thời
      gian|Lịch trình)'', str(val), flags=re.S|re.I) or "")) if s.strip()]'
  route:
    source: css
    selector: table[border="0"]
    clean: '[re.sub(r''(?i)^\s*(khám phá|tham quan|du lịch(\s+khách\s+đoàn)?(\s+tour)?)\s+'',
      '''', s).strip() for s in re.split(r''\s*-\s*'', (research(r''Hành trình\s*(.*?)\s*(?:Thời
      gian|Lịch trình)'', str(val), flags=re.S|re.I) or "")) if s.strip()]'
  transport:
    source: css
    selector: div.ct2-hero-meta > div.ct2-hero-meta-item:nth-of-type(4) b
    clean: ('mixed' if (('máy bay' in str(val).lower()) or ('may bay' in str(val).lower()))
      and (('xe' in str(val).lower()) or ('ô tô' in str(val).lower()) or ('o to' in
      str(val).lower())) else ('flight' if (('máy bay' in str(val).lower()) or ('may
      bay' in str(val).lower()) or ('bay' in str(val).lower())) else ('bus' if 'xe'
      in str(val).lower() else ('train' if (('tàu' in str(val).lower()) or ('train'
      in str(val).lower())) else ('cruise' if (('du thuyền' in str(val).lower()) or
      ('cruise' in str(val).lower())) else 'mixed')))))
  accommodation:
    source: css
    selector: '#sec-included'
    clean: '(''homestay'' if ''homestay'' in str(val).lower() else (''mixed'' if len(set(refindall(r''([2-5])\s*(?:\*|sao)'',
      str(val).lower()))) > 1 else ({''2'': ''2_star'', ''3'': ''3_star'', ''4'':
      ''4_star'', ''5'': ''5_star''}.get(research(r''([2-5])\s*(?:\*|sao)'', str(val).lower()),
      ''mixed''))))'
  duration_days:
    source: css
    selector: div.ct2-hero-meta > div.ct2-hero-meta-item:nth-of-type(1) b
    clean: (int(research(r'(\d+)\s*N', str(val))) if research(r'(\d+)\s*N', str(val))
      else (int(research(r'(\d+)\s*ngày', str(val).lower())) if research(r'(\d+)\s*ngày',
      str(val).lower()) else ''))
  duration_nights:
    source: css
    selector: div.ct2-hero-meta > div.ct2-hero-meta-item:nth-of-type(1) b
    clean: (int(research(r'(\d+)\s*Đ', str(val))) if research(r'(\d+)\s*Đ', str(val))
      else (int(research(r'(\d+)\s*đêm', str(val).lower())) if research(r'(\d+)\s*đêm',
      str(val).lower()) else ''))
  price:
    source: css
    selector: '#ct2BookHeadPrice'
    clean: (int(re.sub(r'\D', '', str(val))) if research(r'(\d)', str(val)) else '')
  currency:
    source: css
    selector: '#ct2BookHeadPrice'
    clean: '''VND'''
  price_type:
    source: css
    selector: div.ct2-book-head
    clean: ('contact' if 'liên hệ' in str(val).lower() else ('from' if 'giá từ' in
      str(val).lower() else 'fixed'))
  departure_pattern:
    source: css
    selector: div.ct2-hero-meta > div.ct2-hero-meta-item:nth-of-type(3) b
  offers:
    source: css
    selector: div#vnt-content > script:nth-of-type(7)
    clean: 'sorted([{''departure_date'': str(d.get(''startday'', ''''))[:10], ''price'':
      int(d.get(''final'') or d.get(''adult'') or 0), ''availability'': (''available''
      if int(d.get(''available'') or 0) > 0 else ''sold_out''), ''price_by_age'':
      {''adult'': int(d.get(''adult'') or 0), ''child'': int(d.get(''child'') or 0),
      ''small_child'': int(d.get(''baby'') or 0), ''infant'': int(d.get(''infant'')
      or 0)}, ''single_supplement'': int(d.get(''singleroom'') or 0)} | ({''hotel_location'':
      str(d.get(''name'', '''')).strip()} if (''ch sạn'' in str(d.get(''name'', ''''))
      or ''hotel'' in str(d.get(''name'', '''')).lower()) else {}) for d in json.loads(research(r''CT2_SCHED\s*=\s*(\{.*?\});'',
      str(val), flags=re.S) or ''{}'').values()], key=lambda x: (x[''departure_date''],
      x[''price'']))'
  itinerary:
    source: css
    selector: '#sec-itinerary'
    clean: re.sub(r'(?s)^.*?Xem tất cả\s*', '', str(val)).strip()
  inclusions:
    source: css
    selector: '#sec-included'
    clean: (re.split(r'GIÁ\s+(?:TOUR\s+)?KHÔNG\s+BAO\s+GỒ\s*M\s*:?|Không\s+bao\s+gồ\s*m\s*:',
      re.sub(r'(?s)^.*?\(Xem thêm\)\s*', '', str(val)), flags=re.I)[0].strip())
  exclusions:
    source: css
    selector: '#sec-included'
    clean: (re.split(r'GIÁ\s+(?:TOUR\s+)?KHÔNG\s+BAO\s+GỒ\s*M\s*:?|Không\s+bao\s+gồ\s*m\s*:',
      re.sub(r'(?s)^.*?\(Xem thêm\)\s*', '', str(val)), flags=re.I)[1].strip() if len(re.split(r'GIÁ\s+(?:TOUR\s+)?KHÔNG\s+BAO\s+GỒ\s*M\s*:?|Không\s+bao\s+gồ\s*m\s*:',
      re.sub(r'(?s)^.*?\(Xem thêm\)\s*', '', str(val)), flags=re.I)) > 1 else '')
  cancellation_policy:
    source: css
    selector: '#sec-notes'
    clean: (research(r'((?:Quy định thanh toán|QUY ĐỊNH MUA|ĐĂNG KÝ TOUR|ĐIỀU KIỆN HỦY TOUR|Điều
      kiện khi đăng ký).*?)(?=CÁC LƯU Ý|LƯU Ý|HƯỚNG DẪN|KÍNH CHÚC|$)', str(val), flags=re.S|re.I)
      or ' '.join(list(dict.fromkeys(refindall(r'(?:\S+\s+){0,12}\b(?:hủy|huỷ|thanh toán|phạt|đặt
      cọc)\b(?:\s+\S+){0,30}', str(val), flags=re.I)))))
  surcharges:
    source: css
    selector: '#sec-included'
    clean: ''' ''.join(list(dict.fromkeys(refindall(r''(?:\S+\s+){0,12}\b(?:phụ thu|phụ
      phí|phòng đơn|giường đơn|bồi dưỡng|tip|visa|hộ chiếu)\b(?:\s+\S+){0,30}'', str(val),
      flags=re.I))))'
  child_policy:
    source: css
    selector: '#sec-notes'
    clean: (research(r'((?:Giá|QUY ĐỊNH).*?(?:VÉ|vé).*?(?:TRẺ EM|trẻ em).*?)(?=QUY ĐỊNH
      MUA|ĐĂNG KÝ|ĐIỀU KIỆN|Điều kiện|Quy định thanh toán|CÁC LƯU Ý|LƯU Ý|HƯỚNG DẪN|Lưu
      ý|KÍNH CHÚC|$)', __import__('unicodedata').normalize('NFC', str(val)), flags=re.S|re.I)
      or "")
