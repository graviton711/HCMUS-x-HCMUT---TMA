# yaml-language-server: $schema=../profile.schema.json
# Vietravel source profile. Engine reads this; no Vietravel code in engine.
origin: "travel.com.vn"
flows: ["static", "combo_api_browser"]
sitemaps:
  - "https://travel.com.vn/du-lich/sitemap.xml"
  - "https://travel.com.vn/chuong-trinh/sitemap.xml"
tour_url_patterns: ["/chuong-trinh/", "/du-lich/"]
combo:
  path_fragment: "/combo-du-lich/"
  slug_pattern: "cpc([A-Za-z0-9]+)\\.aspx"
  tour_code_param: "tourCode"
aliases:
  tour_name: ["pageTitle", "name"]
  tour_code: ["tourCode"]
  duration: ["dayStay", "dayStayText"]
  price: ["price", "minPrice"]
  currency: ["priceCurrency"]
  departure_city: ["departureName", "departureLocation"]
  destination: ["destination", "visitLocation"]
  departure_dates: ["departureDate", "startDate"]
  itinerary: ["tourSchedules"]
  inclusions: ["priceIncluded"]
  exclusions: ["priceNotIncluded"]
  cancellation_policy: ["noteTransferCancel", "refundPolicy"]
schedule_markers:
  heading: "Lịch trình khởi hành"
  month_pattern: "(tháng\\s*)?(0?[1-9]|1[0-2])\\s*(/|-|năm)?\\s*20\\d{2}"
  date_pattern: "\\d{2}/\\d{2}/20\\d{2}"
notes_key_pattern: "includ|exclud|condition|note|polic|cancel|refund|visa|payment|contact|child"
junk_presentation_keys: ["thumbnail", "image", "imgurl", "icon", "iconesgurl",
  "urlrewrite", "destinationtoascii", "priority"]
keep_patterns: ["(code|date|time|price|discount|sale|cost|fee|name|title|place|hotel|vehicle|transport|stay|duration|score|label|pax|month|year|destination|meeting|guide|star|room|meal|flight|airline|status|mismatch|tiers)$"]
