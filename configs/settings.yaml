# yaml-language-server: $schema=./settings.schema.json
# Global settings for tourtcrawl. Team edits via PR like code.
fetch:
  timeout_s: 20
  max_bytes: 2000000
  delay_s: 0.5
  user_agent: "MLAITourSourceAuditor/0.1"
  retries: 2
  retry_backoff_s: 1.0
  dns_ttl_s: 300
browser:
  timeout_ms: 60000
  max_tabs: 12
  max_rows_per_tab: 12
  wait_response_ms: 3000
  tab_growth_wait_ms: 4000
logging:
  level: "INFO"  # may be overridden by LOG_LEVEL env
batch:
  max_consecutive_failures: 10
  delay_s: 0.5
  workers: 8
sitemap:
  attempts: 2
audit:
  min_evidence: 0.9
survey:
  model: "opencode/muse-spark-1.3-contributor-free"
  variant: "xhigh"
  timeout_min: 20
  prefetch_timeout_s: 15
  max_body_bytes: 2000000
output:
  dir: ".local"
clean:
  min_visible_chars: 40
quality:
  min_tours_ratio: 0.8
  max_price_shift: 0.3
  min_fill_rate: 0.85
  fill_fields: [tour_name, departure_city, destinations, duration_days,
    price, currency, itinerary, inclusions, exclusions]
backend:
  data_provider: fixture
  database_url: sqlite:///data/backend.db
  cors_origins: ["http://127.0.0.1:5173", "http://localhost:5173"]
  cors_origin_regex: "https://[a-z0-9-]+\\.vercel\\.app"
  api:
    host: "127.0.0.1"
    port: 8000
    candidate_default: 20
    candidate_min: 1
    candidate_max: 100
    session_ttl_seconds: 2592000
  data:
    scan_limit: 2000
    providers_limit: 100
    connect_timeout_s: 8
    trusted_domains: []
    freshness_seconds: {departure_date: 86400, price: 86400}
  decide:
    soft_fields: [itinerary, inclusions, exclusions, child_policy, cancellation_policy]
    quote_chars: 200
    risk_words: ["không hoàn", "thu phí 100%", "sold_out", "unknown"]
    analysis_chars: 160
    analysis_items: 6
    top_n: 3
