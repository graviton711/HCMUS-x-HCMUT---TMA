[project]
name = "mlai"
version = "0.1.0"
description = "Decision Intelligence Challenge — lớp ứng dụng trí tuệ hỗ trợ ra quyết định cho người Việt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "tzdata>=2025.2", "uvicorn>=0.34,<1"]

[project.scripts]
tour-backend = "api.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
