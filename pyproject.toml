[project]
name = "mlai"
version = "0.1.0"
description = "Decision Intelligence Challenge — lớp ứng dụng trí tuệ hỗ trợ ra quyết định cho người Việt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
    "beautifulsoup4>=4.12,<5",
    "pyyaml>=6",
    "vi-lunaire==2026.4.11",
]

[project.optional-dependencies]
browser = ["playwright>=1.52"]

[project.scripts]
tour-backend = "api.cli:main"
tour-crawl = "ingest.pipeline:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingest*", "shared*", "api*", "data_access*", "decision*", "domain*", "requirements*", "semantic_assessment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-ra"

# basedpyright mac dinh o che do "recommended" (bat ca rule pedantic nhu
# reportAny/reportUnusedCallResult) -> can baseline "standard" cho ca team.
# Luu y: basedpyright khong cho phep co ca hai section [tool.pyright] va
# [tool.basedpyright] trong pyproject - chi giu [tool.basedpyright].
[tool.basedpyright]
typeCheckingMode = "standard"
reportAny = "none"
reportUnusedCallResult = "none"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
# TODO(merge): backend packages chua typecheck (227 loi co san); bật lại từng
# package khi Khôi dọn xong, khong ha chuan ingest/shared.
exclude = ["artifacts", ".local", "dist", "src/api", "src/data_access", "src/decision", "src/domain", "src/requirements", "src/tourcrawl", "src/semantic_assessment", "src/frontend"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
