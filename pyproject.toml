[project]
name = "mlai"
version = "0.1.0"
description = "Decision Intelligence Challenge — lớp ứng dụng trí tuệ hỗ trợ ra quyết định cho người Việt"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5", "pyyaml>=6"]

[project.optional-dependencies]
browser = ["playwright>=1.52"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[project.scripts]
tour-crawl = "ingest.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingest*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

# basedpyright mac dinh o che do "recommended" (bat ca rule pedantic nhu
# reportAny/reportUnusedCallResult) -> can baseline "standard" cho ca team.
# Luu y: basedpyright khong cho phep co ca hai section [tool.pyright] va
# [tool.basedpyright] trong pyproject - chi giu [tool.basedpyright].
[tool.basedpyright]
typeCheckingMode = "standard"
reportAny = "none"
reportUnusedCallResult = "none"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
