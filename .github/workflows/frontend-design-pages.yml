name: Frontend design preview

on:
  push:
    branches:
      - feature/minh-phu
    paths:
      - prototypes/frontend-design/**
      - .github/workflows/frontend-design-pages.yml

permissions:
  contents: read

concurrency:
  group: frontend-design-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/feature/minh-phu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload only the design prototype
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: prototypes/frontend-design

      - name: Publish design preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
